<h1><small>道德經 · 第九章</small>持而盈之，不如其已</h1>
<p class="yuan answer">持而盈之，不如其已；揣而梲之，不可長保。金玉滿堂，莫之能守；富貴而驕，自遺其咎。功遂身退，天之道。</p>
