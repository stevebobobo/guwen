<h1><small>道德經 · 第七章</small>天長地久。天地所以能長且久者</h1>
<p class="yuan answer">天長地久。天地所以能長且久者，以其不自生，故能長生。是以聖人後其身而身先；外其身而身存。非以其無私邪，故能成其私。</p>
