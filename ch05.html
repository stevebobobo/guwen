<h1><small>道德經 · 第五章</small>天地不仁，以萬物為芻狗</h1>
<p class="yuan answer">天地不仁，以萬物為芻狗；聖人不仁，以百姓為芻狗。天地之間，其猶橐籥乎？虛而不屈，動而愈出。多言數窮，不如守中。</p>
