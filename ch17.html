<h1><small>道德經 · 第十七章</small>太上，下知有之</h1>
<p class="yuan answer">太上，下知有之，其次，親而譽之，其次，畏之，其次，侮之。信不足焉，有不信焉。悠兮其貴言，功成事遂，百姓皆謂：我自然。</p>
