<h1><small>道德經 · 第四章</small>道沖而用之或不盈</h1>
<p class="yuan answer">道沖而用之或不盈，淵兮似萬物之宗。挫其銳，解其紛，和其光，同其塵。湛兮似或存。吾不知誰之子，象帝之先。</p>
