<h1><small>道德經 · 第三章</small>不尚賢，使民不爭</h1>
<p class="yuan answer">不尚賢，使民不爭；不貴難得之貨，使民不為盜；不見可欲，使民心不亂。是以聖人之治，虛其心，實其腹，弱其志，強其骨。常使民無知無欲，使夫智者不敢為也。為無為，則無不治。</p>
