<h1><small>道德經 · 第八章</small>上善若水。水善利萬物而不爭</h1>
<p class="yuan answer">上善若水。水善利萬物而不爭，處眾人之所惡，故幾於道。居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。夫唯不爭，故無尤。</p>
