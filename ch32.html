<h1><small>道德經 · 第三十二章</small>道常無名</h1>
<p class="yuan answer">道常無名，樸雖小，天下莫能臣也。侯王若能守之，萬物將自賓。天地相合，以降甘露，民莫之令而自均。始制有名，名亦既有，夫亦將知止，知止所以不殆。譬道之在天下，猶川谷之於江海。</p>
