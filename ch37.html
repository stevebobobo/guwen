<h1><small>道德經 · 第三十七章</small>道常無為而無不為</h1>
<p class="yuan answer">道常無為而無不為。侯王若能守之，萬物將自化。化而欲作，吾將鎮之以無名之樸。無名之樸，夫亦將無欲。不欲以靜，天下將自定。</p>
