<h1><small>道德經 · 第三十四章</small>大道氾兮</h1>
<p class="yuan answer">大道氾兮，其可左右。萬物恃之而生而不辭，功成不名有。衣養萬物而不為主，常無欲，可名於小；萬物歸焉而不為主，可名為大。以其終不自為大，故能成其大。</p>
