<h1><small>道德經 · 第三十六章</small>將欲歙之</h1>
<p class="yuan answer">將欲歙之，必固張之；將欲弱之，必固強之；將欲廢之，必固興之；將欲奪之，必固與之。是謂微明。柔弱勝剛強。魚不可脫於淵，國之利器不可以示人。</p>
