<h1><small>道德經 · 第三十五章</small>執大象</h1>
<p class="yuan answer">執大象，天下往。往而不害，安平太。樂與餌，過客止。道之出口，淡乎其無味，視之不足見，聽之不足聞，用之不足既。</p>
