<h1><small>道德經 · 第二十六章</small>重為輕根</h1>
<p class="yuan answer">重為輕根，靜為躁君。是以聖人終日行不離輜重。雖有榮觀，燕處超然。奈何萬乘之主，而以身輕天下？輕則失本，躁則失君。</p>
