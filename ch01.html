<h1><small>道德經 · 第一章</small>道可道，非常道</h1>
<p class="yuan answer">道可道，非常道；名可名，非常名。無名天地之始；有名萬物之母。故常無欲，以觀其妙；常有欲，以觀其徼。此兩者，同出而異名，同謂之玄。玄之又玄，眾妙之門。</p>
